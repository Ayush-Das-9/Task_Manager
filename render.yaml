services:
  - type: web
    name: task-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://task-manager-2h25.onrender.com


